<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sueños | Deco Artesanal</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#f8f4ee;
    color:#3e2b1f;
}

button{
    cursor:pointer;
    border:none;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#fffaf4;
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 18px;
    box-shadow:0 2px 10px #00000015;
}

.logo{
    font-size:25px;
    font-weight:bold;
    text-align:center;
}

.logo small{
    display:block;
    font-size:11px;
    font-weight:normal;
}

.header-btn{
    background:none;
    font-size:25px;
    color:#4b3325;
}

.cart{
    position:relative;
}

.cart-number{
    position:absolute;
    background:#704b32;
    color:white;
    font-size:11px;
    border-radius:50%;
    width:18px;
    height:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    right:-5px;
    top:-5px;
}

/* HERO */

.hero{
    margin:15px;
    height:390px;
    border-radius:20px;
    background:
    linear-gradient(90deg,#eee0d1dd,#eee0d122),
    url("https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=1000&q=80");
    background-size:cover;
    background-position:center;
    padding:45px 25px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.hero h1{
    font-family:cursive;
    font-size:38px;
    max-width:260px;
    line-height:1.1;
}

.hero p{
    margin-top:18px;
    font-size:17px;
    max-width:270px;
}

.main-btn{
    margin-top:22px;
    width:max-content;
    padding:14px 22px;
    border-radius:25px;
    background:#704b32;
    color:white;
    font-weight:bold;
}

/* CATEGORIAS */

.categories{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:15px;
}

.category{
    min-width:95px;
    text-align:center;
}

.category img{
    width:85px;
    height:85px;
    object-fit:cover;
    border-radius:50%;
}

.category p{
    margin-top:7px;
    font-weight:bold;
    font-size:13px;
}

/* PRODUCTOS */

.section-title{
    text-align:center;
    margin:25px 0 15px;
    font-family:cursive;
    font-size:28px;
}

.products{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:15px;
}

.product{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 10px #00000012;
    position:relative;
}

.product img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.product-info{
    padding:12px;
}

.product h3{
    font-size:16px;
}

.price{
    font-size:20px;
    font-weight:bold;
    margin:7px 0;
}

.product button{
    width:100%;
    padding:10px;
    border-radius:20px;
    background:#704b32;
    color:white;
}

/* BUSCADOR */

.search-box{
    display:none;
    padding:12px 15px;
    background:white;
}

.search-box input{
    width:100%;
    padding:13px;
    border-radius:25px;
    border:1px solid #ddd;
    outline:none;
}

/* MODAL PRODUCTO */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#00000088;
    z-index:200;
    align-items:flex-end;
}

.modal-content{
    background:#fffaf4;
    width:100%;
    max-height:90vh;
    overflow:auto;
    border-radius:25px 25px 0 0;
    padding-bottom:25px;
}

.modal-img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.close{
    position:absolute;
    right:20px;
    top:15px;
    background:white;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:22px;
}

.product-detail{
    padding:20px;
}

.product-detail h2{
    font-size:25px;
}

.description{
    margin:12px 0;
    line-height:1.5;
}

.quantity{
    display:flex;
    align-items:center;
    gap:15px;
    margin:15px 0;
}

.quantity button{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#e8d8c8;
}

.action{
    width:100%;
    padding:15px;
    border-radius:25px;
    margin-top:10px;
    font-size:16px;
    font-weight:bold;
}

.add{
    background:#e7d7c5;
    color:#4b3325;
}

.buy{
    background:#704b32;
    color:white;
}

.ml{
    background:#ffe600;
    color:#333;
}

/* CARRITO */

.cart-panel{
    display:none;
    position:fixed;
    inset:0;
    background:#00000088;
    z-index:300;
}

.cart-content{
    position:absolute;
    right:0;
    top:0;
    height:100%;
    width:90%;
    max-width:400px;
    background:#fffaf4;
    padding:20px;
    overflow:auto;
}

.cart-item{
    display:flex;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #ddd;
}

.cart-item img{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:10px;
}

.total{
    font-size:22px;
    font-weight:bold;
    margin:20px 0;
}

/* PAGOS */

.payment{
    margin-top:20px;
    padding:15px;
    background:white;
    border-radius:15px;
}

.payment h3{
    margin-bottom:12px;
}

.payment label{
    display:block;
    padding:10px;
    border-bottom:1px solid #eee;
}

/* NAV */

.bottom-nav{
    position:sticky;
    bottom:0;
    background:#fffaf4;
    height:65px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    border-top:1px solid #ddd;
}

.bottom-nav button{
    background:none;
    color:#4b3325;
    font-size:12px;
}

.bottom-nav span{
    display:block;
    font-size:22px;
}

/* ESCRITORIO */

@media(min-width:700px){
    body{
        max-width:500px;
        margin:auto;
        box-shadow:0 0 30px #00000015;
    }
}
</style>
</head>

<body>

<label>💳 Tarjeta de débito</label>

</div>

<button class="action ml" onclick="goMercadoLibre()">

</div>

</div>
</div>

<!-- CARRITO -->

<div class="cart-panel" id="cartPanel">

<div class="cart-content">

<div class="total">
Total: $<span id="cartTotal">0</span>
</div>

<button class="action buy" onclick="checkout()">
Continuar compra
</button>

</div>

</div>

<!-- NAV -->

<nav class="bottom-nav">

<button onclick="scrollTopPage()">
<span>⌂</span>
Inicio
</button>

<button onclick="scrollProducts()">
<span>▦</span>
Productos
</button>

<button onclick="openCart()">
<span>🛒</span>
Carrito
</button>

<button onclick="contact()">
<span>♡</span>
Contacto
</button>

</nav>
