<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Creaciones Silvia</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #fbf9f6; max-width: 400px; margin: 0 auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: white; padding: 10px; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 5px #ddd; }
        .card img { width: 100%; height: 120px; object-fit: cover; background: #eee; }
        .detail { display: none; background: white; padding: 20px; border-radius: 8px; }
        .active { display: block; }
        .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 15px 0; }
        .gallery img { width: 100%; height: 80px; object-fit: cover; background: #eee; }
    </style>
</head>
<body>

    <div id="view-home" class="active">
        <h1>Creaciones Silvia</h1>
        <div class="grid" id="lista-productos"></div>
    </div>

    <div id="view-detail" class="detail">
        <button onclick="document.getElementById('view-home').classList.add('active'); document.getElementById('view-detail').classList.remove('active')">← Volver</button>
        <h2 id="det-titulo"></h2>
        <div class="gallery" id="lista-fotos"></div>
    </div>

    <script>
        // --- AQUÍ SOLO CAMBIAS EL NOMBRE DEL PRODUCTO ---
        const prods = [
            { id: 1, nombre: 'Atrapasueños Flores' },
            { id: 2, nombre: 'Producto 2' },
            { id: 3, nombre: 'Producto 3' },
            { id: 4, nombre: 'Producto 4' },
            { id: 5, nombre: 'Producto 5' },
            { id: 6, nombre: 'Producto 6' },
            { id: 7, nombre: 'Producto 7' },
            { id: 8, nombre: 'Producto 8' },
            { id: 9, nombre: 'Producto 9' },
            { id: 10, nombre: 'Producto 10' },
            { id: 11, nombre: 'Producto 11' }
        ];

        function renderHome() {
            let html = "";
            prods.forEach(p => {
                html += `<div class="card" onclick="verDetalle(${p.id})">
                            <img src="${p.id}-1.jpg" onerror="this.src='https://via.placeholder.com/150'">
                            <p>${p.nombre}</p>
                         </div>`;
            });
            document.getElementById('lista-productos').innerHTML = html;
        }

        function verDetalle(id) {
            document.getElementById('view-home').classList.remove('active');
            document.getElementById('view-detail').classList.add('active');
            document.getElementById('det-titulo').innerText = prods.find(p=>p.id==id).nombre;
            
            let fotosHtml = "";
            for(let i=1; i<=6; i++) {
                fotosHtml += `<img src="${id}-${i}.jpg" onerror="this.style.display='none'">`;
            }
            document.getElementById('lista-fotos').innerHTML = fotosHtml;
        }

        renderHome();
    </script>
</body>
</html>
