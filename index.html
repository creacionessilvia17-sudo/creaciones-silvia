<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sueños - Deco Artesanal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fcf9f5;
            --card-bg: #ffffff;
            --primary-text: #3a2e2b;
            --button-brown: #8c6853;
            --button-hover: #735340;
            --accent-red: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        body { 
            background-color: var(--bg-color); 
            color: var(--primary-text); 
            max-width: 480px; 
            margin: 0 auto; 
            padding-bottom: 80px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
        }

        /* --- HEADER Y BUSCADOR --- */
        header { padding: 15px 20px; background: #fff; text-align: center; border-bottom: 1px solid #f0ece9; }
        .logo-title { font-family: 'Caveat', cursive; font-size: 2.2rem; color: var(--primary-text); }
        .logo-subtitle { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: #777; margin-bottom: 10px; }

        .search-container { 
            display: flex; 
            align-items: center; 
            background: #f4ece6; 
            padding: 8px 15px; 
            border-radius: 20px; 
        }
        .search-container input { 
            border: none; 
            background: transparent; 
            width: 100%; 
            outline: none; 
            margin-left: 10px; 
            font-size: 0.85rem; 
            color: var(--primary-text);
        }

        /* --- CATEGORÍAS --- */
        .categories-section { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            padding: 20px 10px 10px 10px; 
            text-align: center;
        }
        .category-item { cursor: pointer; transition: transform 0.2s; }
        .category-item:hover { transform: translateY(-3px); }
        .category-img { 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            background: #f3ece3; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto 6px auto; 
            border: 1px solid #e0d7cd;
        }
        .category-img i { font-size: 1.3rem; color: var(--button-brown); }
        .category-item span { font-size: 0.7rem; font-weight: 600; display: block; }

        /* Botón Mostrar Todos */
        .show-all-container { text-align: center; margin: 10px 0; }
        .btn-show-all {
            background: #f3ece3;
            border: 1px solid #d1c7bc;
            color: var(--button-brown);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-show-all:hover { background: var(--button-brown); color: white; }

        /* --- TITULO SECCIÓN --- */
        .section-title {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 20px 20px 20px;
            gap: 10px;
        }
        .section-title hr { flex: 1; border: none; height: 1px; background-color: #d1c7bc; }
        .section-title h2 { font-size: 0.95rem; font-weight: 600; }

        /* --- PRODUCTOS --- */
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 15px; }
        .product-card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 10px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Botón de Favorito */
        .btn-fav {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            transition: transform 0.2s;
        }
        .btn-fav i { font-size: 0.9rem; color: #888; }
        .btn-fav.active i { color: var(--accent-red); font-weight: 900; }

        .product-img-container { 
            width: 100%; 
            height: 140px; 
            border-radius: 8px; 
            overflow: hidden; 
            background: #f7f5f0; 
            margin-bottom: 10px; 
        }
        .product-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .product-info h3 { font-size: 0.8rem; font-weight: 600; margin-bottom: 10px; text-align: center; }
        .btn-add-cart { 
            width: 100%; 
            background-color: var(--button-brown); 
            color: white; 
            border: none; 
            padding: 8px; 
            border-radius: 6px; 
            font-size: 0.75rem; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-add-cart:hover { background-color: var(--button-hover); }

        /* --- NAVEGACIÓN INFERIOR --- */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 100%; 
            max-width: 480px; 
            background: #fff; 
            display: flex; 
            justify-content: space-around; 
            padding: 12px 0; 
            border-top: 1px solid #eee; 
            z-index: 100;
        }
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-size: 0.7rem; 
            color: #666; 
            text-decoration: none; 
            position: relative;
        }
        .nav-item i { font-size: 1.2rem; margin-bottom: 3px; }
        
        /* Contador del Carrito */
        .cart-badge {
            position: absolute;
            top: -5px;
            right: 0px;
            background-color: var(--button-brown);
            color: white;
            font-size: 0.6rem;
            font-weight: bold;
            border-radius: 50%;
            padding: 2px 6px;
        }
    </style>
</head>
<body>

    <!-- Header & Buscador -->
    <header>
        <div class="logo-title">Sueños</div>
        <div class="logo-subtitle">• deco artesanal •</div>
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass" style="color: #8c6853;"></i>
            <input type="text" id="buscador" placeholder="Buscar en la tienda..." onkeyup="buscarProductos()">
        </div>
    </header>

    <!-- Las 4 Categorías -->
    <section class="categories-section">
        <div class="category-item" onclick="filtrarProductos('atrapasuenos')">
            <div class="category-img"><i class="fa-solid fa-dharmachakra"></i></div>
            <span>Atrapasueños</span>
        </div>
        <div class="category-item" onclick="filtrarProductos('caminitos')">
            <div class="category-img"><i class="fa-solid fa-rug"></i></div>
            <span>Caminitos</span>
        </div>
        <div class="category-item" onclick="filtrarProductos('borlas')">
            <div class="category-img"><i class="fa-solid fa-certificate"></i></div>
            <span>Borlas</span>
        </div>
        <div class="category-item" onclick="filtrarProductos('atrapasoles')">
            <div class="category-img"><i class="fa-solid fa-gem"></i></div>
            <span>Atrapasoles</span>
        </div>
    </section>

    <!-- Opción Mostrar Todos -->
    <div class="show-all-container">
        <button class="btn-show-all" onclick="filtrarProductos('todos')">✨ Mostrar todos los productos</button>
    </div>

    <!-- Título de Sección -->
    <div class="section-title">
        <hr>
        <h2 id="titulo-seccion">Todos los productos</h2>
        <hr>
    </div>

    <!-- Grilla de Productos -->
    <section class="products-grid" id="contenedor-productos">
        
        <!-- Atrapasueños -->
        <div class="product-card" data-category="atrapasuenos" data-name="atrapasueños beige">
            <button class="btn-fav" onclick="toggleFavorito(this)"><i class="fa-regular fa-heart"></i></button>
            <div class="product-img-container">
                <img src="https://via.placeholder.com/200x200/f3ece3/8c6853?text=Atrapasue%C3%B1os" alt="Atrapasueños">
            </div>
            <div class="product-info">
                <h3>Atrapasueños Beige</h3>
                <button class="btn-add-cart" onclick="agregarAlCarrito('Atrapasueños Beige')"><i class="fa-solid fa-cart-shopping"></i> Agregar al carrito</button>
            </div>
        </div>

        <!-- Caminito -->
        <div class="product-card" data-category="caminitos" data-name="caminito boho natural">
            <button class="btn-fav" onclick="toggleFavorito(this)"><i class="fa-regular fa-heart"></i></button>
            <div class="product-img-container">
                <img src="https://via.placeholder.com/200x200/f3ece3/8c6853?text=Caminito" alt="Caminito">
            </div>
            <div class="product-info">
                <h3>Caminito Boho Natural</h3>
                <button class="btn-add-cart" onclick="agregarAlCarrito('Caminito Boho Natural')"><i class="fa-solid fa-cart-shopping"></i> Agregar al carrito</button>
            </div>
        </div>

        <!-- Borla -->
        <div class="product-card" data-category="borlas" data-name="borla rosa decorativa">
            <button class="btn-fav" onclick="toggleFavorito(this)"><i class="fa-regular fa-heart"></i></button>
            <div class="product-img-container">
                <img src="https://via.placeholder.com/200x200/f3ece3/8c6853?text=Borla" alt="Borla">
            </div>
            <div class="product-info">
                <h3>Borla Colgante Rosa</h3>
                <button class="btn-add-cart" onclick="agregarAlCarrito('Borla Colgante Rosa')"><i class="fa-solid fa-cart-shopping"></i> Agregar al carrito</button>
            </div>
        </div>

        <!-- Atrapasol -->
        <div class="product-card" data-category="atrapasoles" data-name="atrapasol cristal luz">
            <button class="btn-fav" onclick="toggleFavorito(this)"><i class="fa-regular fa-heart"></i></button>
            <div class="product-img-container">
                <img src="https://via.placeholder.com/200x200/f3ece3/8c6853?text=Atrapasol" alt="Atrapasol">
            </div>
            <div class="product-info">
                <h3>Atrapasol Cristal LUZ</h3>
                <button class="btn-add-cart" onclick="agregarAlCarrito('Atrapasol Cristal LUZ')"><i class="fa-solid fa-cart-shopping"></i> Agregar al carrito</button>
            </div>
        </div>

    </section>

    <!-- Menú Inferior -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item" onclick="filtrarProductos('todos')">
            <i class="fa-solid fa-house"></i>
            <span>Inicio</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-regular fa-heart"></i>
            <span>Favoritos</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Carrito</span>
            <span class="cart-badge" id="contador-carrito">0</span>
        </a>
    </nav>

    <!-- Funcionalidades JavaScript -->
    <script>
        let contadorCarrito = 0;

        // Filtrar productos por categoría o mostrar todos
        function filtrarProductos(categoria) {
            let tarjetas = document.getElementsByClassName('product-card');
            let titulo = document.getElementById('titulo-seccion');

            for (let card of tarjetas) {
                if (categoria === 'todos' || card.getAttribute('data-category') === categoria) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            }

            if (categoria === 'todos') {
                titulo.innerText = "Todos los productos";
            } else {
                titulo.innerText = categoria.charAt(0).toUpperCase() + categoria.slice(1);
            }
        }

        // Buscador por texto
        function buscarProductos() {
            let texto = document.getElementById('buscador').value.toLowerCase();
            let tarjetas = document.getElementsByClassName('product-card');

            for (let card of tarjetas) {
                let nombre = card.getAttribute('data-name');
                if (nombre.includes(texto)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            }
        }

        // Activar o desactivar Favoritos
        function toggleFavorito(btn) {
            btn.classList.toggle('active');
            let icono = btn.querySelector('i');
            if (btn.classList.contains('active')) {
                icono.classList.remove('fa-regular');
                icono.classList.add('fa-solid');
            } else {
                icono.classList.remove('fa-solid');
                icono.classList.add('fa-regular');
            }
        }

        // Agregar al Carrito e Incrementar Contador
        function agregarAlCarrito(nombreProducto) {
            contadorCarrito++;
            document.getElementById('contador-carrito').innerText = contadorCarrito;
            alert(`¡"${nombreProducto}" fue agregado al carrito!`);
        }
    </script>
</body>
</html>
