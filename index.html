<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sueños - Deco Artesanal</title>
  <style>
    :root { --bg-color: #f7f4ef; --primary-brown: #6b523e; }
    body { background-color: #ccc; display: flex; justify-content: center; margin: 0; font-family: sans-serif; }
    .app-container { width: 100%; max-width: 420px; background-color: #fff; min-height: 100vh; position: relative; display: flex; flex-direction: column; }
    .view { display: none; padding-bottom: 70px; }
    .view.active { display: block; }
    
    .img-placeholder { background-color: #dcd7d1; display: flex; align-items: center; justify-content: center; color: #6b523e; font-weight: bold; }
    
    /* Barra de navegación sin el botón perfil */
    .tab-bar { position: fixed; bottom: 0; width: 100%; max-width: 420px; height: 60px; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; }
    .tab-bar button { border: none; background: none; cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>

<div class="app-container">
  <header style="padding: 15px; border-bottom: 1px solid #eee; display:flex; justify-content: space-between; align-items: center;">
    <strong>SUEÑOS - DECO ARTESANAL</strong>
    <span>🛒 <span id="cart-count">0</span></span>
  </header>

  <!-- VISTAS -->
  <main id="home-view" class="view active">
    <div class="img-placeholder" style="height: 200px;">BANNER PRINCIPAL</div>
    <h3 style="padding: 15px;">Productos Destacados</h3>
    <div id="product-list" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px;"></div>
  </main>

  <main id="compras-view" class="view">
    <h2 style="padding: 20px;">Mis Compras</h2>
    <p style="padding: 20px;">Aquí aparecerá tu historial de pedidos.</p>
  </main>

  <!-- NAVEGACIÓN (Solo Inicio y Compras) -->
  <nav class="tab-bar">
    <button onclick="switchView('home-view')">🏠 Inicio</button>
    <button onclick="switchView('compras-view')">📦 Compras</button>
  </nav>
</div>

<script>
  const products = [
    { name: "Atrapasueños", price: "$8.500" },
    { name: "Caminito", price: "$7.200" },
    { name: "Borla", price: "$3.300" },
    { name: "Atrapasol", price: "$4.800" }
  ];

  function renderProducts() {
    const container = document.getElementById('product-list');
    container.innerHTML = products.map(p => `
      <div style="border: 1px solid #eee; padding: 10px; border-radius: 8px;">
        <div class="img-placeholder" style="height: 100px;">FOTO</div>
        <p style="margin: 10px 0 5px 0;">${p.name}</p>
        <strong>${p.price}</strong>
        <button onclick="addToCart()" style="display:block; width:100%; margin-top:10px; padding: 8px; cursor: pointer;">Agregar</button>
      </div>
    `).join('');
  }

  function switchView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
  }

  function addToCart() {
    let count = parseInt(document.getElementById('cart-count').innerText) + 1;
    document.getElementById('cart-count').innerText = count;
  }

  renderProducts();
</script>
</body>
</html>
